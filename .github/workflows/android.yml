name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and replace the release even if this version is already published"
        type: boolean
        default: false
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get the Garage Log app
        uses: actions/checkout@v4
        with:
          repository: Orangitaz/GarageLogger
          ref: main
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Read version
        id: ver
        run: |
          echo "v=$(tr -d '[:space:]' < app/VERSION)" >> "$GITHUB_OUTPUT"
          echo "b=$(git -C app rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Is this version already published?
        id: chk
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          V="${{ steps.ver.outputs.v }}"
          if gh release view "v$V" >/dev/null 2>&1; then
            if [ "$FORCE" = "true" ]; then
              gh release delete "v$V" --yes
              echo "skip=false" >> "$GITHUB_OUTPUT"
            else
              echo "Version $V already published - nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bundle the app
        if: steps.chk.outputs.skip != 'true'
        run: |
          mkdir -p www
          sed -e "s/__VERSION__/${{ steps.ver.outputs.v }}/" -e "s/__BUILD__/${{ steps.ver.outputs.b }}/" app/index.html > www/index.html
          grep -c "Capacitor" www/index.html

      - name: Create Android project
        if: steps.chk.outputs.skip != 'true'
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap add android
          npx cap sync android

      - name: Set version, icon and network settings
        if: steps.chk.outputs.skip != 'true'
        run: |
          V="${{ steps.ver.outputs.v }}"
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$V\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          for d in android/app/src/main/res/mipmap-*; do
            case "$d" in *anydpi*) continue;; esac
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              cp icon.png "$d/$n.png"
            done
          done
          mkdir -p android/app/src/main/res/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="ic_launcher_background">#06080C</color></resources>\n' > android/app/src/main/res/values/ic_launcher_background.xml
          M=android/app/src/main/AndroidManifest.xml
          grep -q usesCleartextTraffic "$M" || sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$M"
          grep -n "usesCleartextTraffic\|INTERNET" "$M"

      - name: Use fixed signing key
        if: steps.chk.outputs.skip != 'true'
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Build APK
        if: steps.chk.outputs.skip != 'true'
        working-directory: android
        run: |
          set +e
          ./gradlew --no-daemon assembleDebug > ../gradle.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            M=$(grep -E -A12 "What went wrong|error:|FAILED" ../gradle.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle failed::$M"
          fi
          exit $rc

      - name: Name the APK
        if: steps.chk.outputs.skip != 'true'
        run: |
          V="${{ steps.ver.outputs.v }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "garage-log-${V//./_}.apk"

      - name: Publish the release
        if: steps.chk.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.v }}"
          N="garage-log-${V//./_}.apk"
          cp "$N" garage-log.apk
          awk -v v="$V" '/^## /{p=($2==v)} p' app/CHANGELOG.md | tail -n +2 > notes.md
          [ -s notes.md ] || echo "Garage Log $V" > notes.md
          gh release create "v$V" garage-log.apk "$N" --title "Garage Log $V" --notes-file notes.md --latest
